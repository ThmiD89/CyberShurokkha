version: "3.9"

services:
  db:
    image: postgres:15
    container_name: cybershurokkha_db
    restart: always
    environment:
      POSTGRES_USER: cyberadmin
      POSTGRES_PASSWORD: cyberpass123
      POSTGRES_DB: cybershurokkha
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: cybershurokkha_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: